[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-image-retrieval"
version = "0.1.0"
description = "Chinese text/image retrieval with Qwen semantic indexing and optional LoRA adaptation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "Pillow>=10,<13"]

[project.optional-dependencies]
models = ["torch==2.9.0", "torchvision==0.24.0", "transformers==4.57.1", "accelerate==1.11.0", "peft==0.17.1", "qwen-vl-utils==0.0.14"]
dev = ["pytest>=8,<10"]

[project.scripts]
mm-retrieval = "mmretrieval.cli:main"

[tool.setuptools.packages.find]
include = ["mmretrieval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
